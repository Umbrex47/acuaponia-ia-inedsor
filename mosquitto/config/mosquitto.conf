# Configuración de Mosquitto para Aquaponic OS.
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Listener MQTT TCP — lo usan el backend, el ESP32 y el simulador.
listener 1883
protocol mqtt

# Listener MQTT sobre WebSocket — opcional, para que el navegador se conecte
# directo al broker. En producción detrás de TLS (wss) si se expone.
listener 9001
protocol websockets

# ⚠️ Acceso anónimo: simple para arrancar sin errores. Para producción real,
# crea un passwd file y pon `allow_anonymous false` + `password_file`.
allow_anonymous true
