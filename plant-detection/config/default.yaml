# Configuración general de IAPlantass

camera:
  # Ruta al archivo de calibración (copia calibration.yaml.example)
  calibration_file: config/calibration.yaml

segmentation:
  # Índice de vegetación ExG: 2*G - R - B (umbral adaptativo si null)
  exg_threshold: null
  min_plant_area_px: 2500
  max_plants: 20

health:
  model_path: models/health_classifier.pt
  # Sin modelo entrenado: usa heurísticas de color (modo bootstrap)
  fallback_heuristics: true
  input_size: 224

state:
  # Umbrales de área relativa (fracción del área total de plantas en la imagen)
  seedling_max: 0.08
  vegetative_max: 0.35
  flowering_max: 0.65
  # Por encima de flowering_max → harvest_ready

api:
  host: 0.0.0.0
  port: 8000
  max_upload_mb: 10
