server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # La config de runtime y el index NO se cachean, para que los cambios de
    # variables de entorno apliquen tras un reinicio sin caché obsoleta.
    location = /config.js {
        add_header Cache-Control "no-store, must-revalidate";
        try_files /config.js =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Assets con hash en el nombre → cache agresivo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida sirve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
